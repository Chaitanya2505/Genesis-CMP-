<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Genesis IPL Predictor</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: linear-gradient(135deg,#020617,#0f172a);
}
.fade { animation: fade .3s ease; }
@keyframes fade {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center font-sans">

<!-- ================= OVERLAY ================= -->
<div id="overlay"
class="hidden fixed inset-0 bg-black/80 backdrop-blur z-50 flex items-center justify-center">

<div class="bg-white w-[95%] max-w-5xl rounded-2xl shadow-xl p-8">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <h2 class="text-xl font-bold text-slate-700">Match Analysis</h2>
  <button onclick="closeOverlay()" class="text-gray-400 text-xl">✕</button>
</div>

<!-- TABS -->
<div class="flex gap-3 mb-6">
  <button onclick="showView('insight')" id="tabInsight"
    class="px-4 py-2 rounded-lg bg-indigo-600 text-white">🧠 Insight</button>
  <button onclick="showView('graphs')" id="tabGraphs"
    class="px-4 py-2 rounded-lg bg-slate-200">📊 Graph Analysis</button>
  <button onclick="showView('innings')" id="tabInnings"
    class="px-4 py-2 rounded-lg bg-slate-200">🏏 Projected Innings</button>
</div>

<!-- STEP 1 -->
<div id="viewInsight" class="fade">
  <h1 class="text-3xl font-extrabold text-emerald-600 mb-3">
    🏆 <span id="winnerText"></span> Favoured to Win
  </h1>
  <p class="text-lg text-gray-700">
    The model predicts a
    <span id="probText" class="font-bold text-slate-900"></span>
    chance of victory based on aggregate team strength and match conditions.
  </p>
</div>

<!-- STEP 2 -->
<div id="viewGraphs" class="hidden fade">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="h-[260px]"><canvas id="winChart"></canvas></div>
    <div class="h-[260px]"><canvas id="scoreChart"></canvas></div>
  </div>
</div>

<!-- STEP 3 — 🔥 INNINGS BANDS 🔥 -->
<div id="viewInnings" class="hidden fade">

  <div class="h-[300px]">
    <canvas id="inningsChart"></canvas>
  </div>

  <p class="text-sm text-gray-500 text-center mt-3">
    Horizontal bands show projected runs. Opacity reflects wickets lost.
  </p>

</div>

</div>
</div>

<!-- ================= HOME ================= -->
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

<h1 class="text-3xl font-bold text-center mb-6">Genesis IPL Predictor</h1>

<select id="team1" class="w-full p-3 mb-4 rounded border"></select>
<select id="team2" class="w-full p-3 mb-4 rounded border"></select>
<select id="toss_winner" class="w-full p-3 mb-4 rounded border"></select>
<select id="toss_decision" class="w-full p-3 mb-6 rounded border">
  <option value="Bat">Bat</option>
  <option value="Field">Field</option>
</select>

<button onclick="predictMatch()"
class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold">
Analyze Match
</button>

</div>

<script>
const API="http://127.0.0.1:8000";
let winChart, scoreChart, inningsChart;

window.onload = async () => {
  const r = await fetch(API + "/teams");
  const d = await r.json();
  const opts = d.teams.map(t => `<option>${t}</option>`).join("");
  team1.innerHTML = team2.innerHTML = opts;
  team2.selectedIndex = 1;
  updateToss();
};

function updateToss(){
  toss_winner.innerHTML =
    `<option>${team1.value}</option><option>${team2.value}</option>`;
}
team1.onchange = updateToss;
team2.onchange = updateToss;

function showView(v){
  ["Insight","Graphs","Innings"].forEach(s=>{
    document.getElementById("view"+s).classList.add("hidden");
    document.getElementById("tab"+s).classList.remove("bg-indigo-600","text-white");
  });
  document.getElementById("view"+cap(v)).classList.remove("hidden");
  document.getElementById("tab"+cap(v)).classList.add("bg-indigo-600","text-white");
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

async function predictMatch(){
  const res = await fetch(API + "/predict", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      team1:team1.value,
      team2:team2.value,
      toss_winner:toss_winner.value,
      toss_decision:toss_decision.value
    })
  });

  const d = await res.json();

  winnerText.innerText = d.winner;
  probText.innerText = d.probability + "%";

  renderGraphs(d);
  renderInnings(d);

  showView("insight");
  overlay.classList.remove("hidden");
}

function renderGraphs(d){
  if(winChart) winChart.destroy();
  if(scoreChart) scoreChart.destroy();

  winChart = new Chart(document.getElementById("winChart"), {
    type:"doughnut",
    data:{
      labels:Object.keys(d.analysis.win_split),
      datasets:[{ data:Object.values(d.analysis.win_split),
        backgroundColor:["#6366f1","#10b981"] }]
    },
    options:{ cutout:"65%" }
  });

  scoreChart = new Chart(document.getElementById("scoreChart"), {
    type:"bar",
    data:{
      labels:["1st Innings","2nd Innings"],
      datasets:[{
        data:[d.score_inning_1,d.score_inning_2],
        backgroundColor:["#0ea5e9","#22c55e"]
      }]
    }
  });
}

/* 🔥 STEP 3 — INNINGS BANDS 🔥 */
function renderInnings(d){
  if(inningsChart) inningsChart.destroy();

  const wk1 = Math.min(10, Math.round(d.score_inning_1 / 28));
  const wk2 = Math.min(10, Math.round(d.score_inning_2 / 28));

  inningsChart = new Chart(document.getElementById("inningsChart"), {
    type:"bar",
    data:{
      labels:[team1.value, team2.value],
      datasets:[{
        data:[d.score_inning_1, d.score_inning_2],
        backgroundColor:[
          `rgba(79,70,229,${1 - wk1/12})`,
          `rgba(16,185,129,${1 - wk2/12})`
        ],
        borderRadius: 12,
        barThickness: 36
      }]
    },
    options:{
      indexAxis:"y",
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: ctx => {
              const wk = ctx.dataIndex === 0 ? wk1 : wk2;
              return `${ctx.label}: ${ctx.raw} runs · ${wk} wickets`;
            }
          }
        },
        title:{
          display:true,
          text:"Projected Innings Outcome (Runs vs Wickets)"
        }
      },
      scales:{
        x:{ title:{ display:true, text:"Projected Runs" } },
        y:{ title:{ display:true, text:"Team" } }
      }
    }
  });
}

function closeOverlay(){
  overlay.classList.add("hidden");
}
</script>

</body>
</html>
